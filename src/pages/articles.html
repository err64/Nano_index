{{>head}}
{{>header}}
<main id="main">

  <section class="pagehero" aria-labelledby="ph-h">
    <div class="container pagehero-in">
      <nav class="crumbs" aria-label="面包屑">
        <a href="/">首页</a>
        <svg class="ico" aria-hidden="true"><use href="/assets/img/icons.svg#arrow-right"></use></svg>
        <span aria-current="page">技术文章</span>
      </nav>
      <h1 id="ph-h">不承诺魔法，只拆解证据。</h1>
      <p class="lede">Veriforge 实践系列长文：防作弊、可复现、成本治理。全部机制来自真实实现，每一篇都给出不依赖特定框架、今天就能在你自己的仓库落地的做法清单。</p>
    </div>
  </section>

  <section class="section" aria-labelledby="articles-h">
    <div class="container">
      <h2 id="articles-h" class="sr-only">全部文章</h2>
      <div class="newslist">
        {{ARTICLE_LIST}}
      </div>
    </div>
  </section>

  <section class="section-tight" aria-labelledby="cta-h">
    <div class="container">
      <div class="ctaband reveal">
        <div>
          <h2 id="cta-h">读完想亲手验证一遍？</h2>
          <p>五分钟在本地跑通端到端演示：真实 Git Worktree、真实验证命令、可独立复核的证据链。</p>
        </div>
        <div class="hero-ctas mt-0">
          <a class="btn btn-primary" href="/help#quickstart">快速上手</a>
          <a class="btn" href="/project">了解项目</a>
        </div>
      </div>
    </div>
  </section>

</main>
{{>footer}}
