# Veriforge 官网 · nginx 反向代理（HTTPS 模板）
# 用法：替换 server_name 与证书路径后放入 /etc/nginx/conf.d/ 并 reload
server {
    listen 80;
    listen [::]:80;
    server_name veriforge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veriforge.example.com;

    ssl_certificate     /etc/letsencrypt/live/veriforge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veriforge.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
